<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Django 5 + Tailwind + PostgreSQL{% endblock %}</title>
    <!-- Tailwind CSS CDN for instant demo, or use compiled dist/styles.css -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-full flex flex-col font-sans antialiased">
    <!-- Header -->
    <header class="border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-lg bg-orange-600 flex items-center justify-center text-white font-bold text-sm shadow">
                    Dj
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight">Django 5 + Tailwind + PostgreSQL</span>
                    <span class="ml-2 px-2 py-0.5 text-xs rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-medium">Ready to Ship</span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/admin/" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-orange-600">Django Admin</a>
                <a href="/healthz" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-orange-600">Health Check</a>
                <button onclick="document.documentElement.classList.toggle('dark')" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm">
                    🌓
                </button>
            </div>
        </div>
    </header>

    <!-- Flash Messages -->
    {% if messages %}
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-4">
        {% for message in messages %}
        <div class="p-4 mb-3 rounded-lg border text-sm font-medium {% if message.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-950 dark:border-emerald-800 dark:text-emerald-200{% else %}bg-sky-50 border-sky-200 text-sky-800 dark:bg-sky-950 dark:border-sky-800 dark:text-sky-200{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-6 text-center text-sm text-slate-500">
        <p>Built with Django 5.1, Tailwind CSS 3.4, and PostgreSQL 16. TechTalks Stack Kits.</p>
    </footer>
</body>
</html>
