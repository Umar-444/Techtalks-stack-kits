schema_version: "1.0.0"

name: "Laravel 12 + MongoDB (NoSQL)"
slug: "laravel-mongodb"
version: "1.0.0"
status: "stable"
category: "Laravel"
updated_at: "2026-10-22"

description: "Empty-market pioneer stack combining Laravel 12 with the official mongodb/laravel-mongodb package, embedded document relations, aggregation pipeline builders, and custom Inertia/React dashboard."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "PHP"
    version: "^8.4"
    registry: "packagist"
  framework:
    name: "Laravel"
    version: "^12.0"
    registry: "packagist"
  ui_layer:
    name: "Inertia + React"
    version: "^2.0"
    type: "spa-dashboard"
  database:
    engine: "MongoDB"
    version: ">=7.0"
    features:
      - "embedded-documents"
      - "aggregation-pipeline"
      - "wiredtiger"
  cache_queue:
    engine: "Redis"
    version: ">=7.0"
  auth_system:
    type: "laravel-breeze-inertia"
    features:
      - "Argon2id"
      - "Session Regeneration"

layers:
  starter:
    path: "starter/"
    type: "monolithic-app"
  rules:
    source_dir: "rules/source/"
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: "skills/"
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install, configure, and verify the Laravel 12 + MongoDB 7+ multi-container application.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Build the canonical first feature - EventLog Document Resource with embedded telemetry attributes, aggregation stats, and BOLA policy protection.
      - id: mongodb-aggregation-pipeline
        path: skills/mongodb-aggregation-pipeline/SKILL.md
        description: Construct multi-stage MongoDB aggregation pipelines ($match, $group, $sort) for high-velocity analytics.
      - id: document-schema-validation
        path: skills/document-schema-validation/SKILL.md
        description: Enforce MongoDB collection JSON schema validation, compound indexes, and BSON ObjectId validation.
      - id: mongodb-aggregation
        path: skills/mongodb-aggregation/SKILL.md
        description: Core operations and aggregation query builder for MongoDB Eloquent models.
  evals:
    tasks_dir: "evals/tasks/"
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: "DESIGN.md"
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: "security/"
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: "steps/agent-build-steps.md"
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 15600
  efficiency_tier: "A"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
