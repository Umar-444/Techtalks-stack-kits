# TechTalks Stack Kit Manifest Spec
schema_version: "1.0.0"

name: "Laravel 12 + MongoDB (NoSQL)"
slug: "laravel-mongodb"
version: "1.0.0"
status: "stable"
category: Laravel
updated_at: "2026-10-21"

description: "Empty-market pioneer stack combining Laravel 12 with the official mongodb/laravel-mongodb package, embedded document relations, aggregation pipeline builders, and custom Inertia/React dashboard."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "PHP"
    version: "^8.4"
    registry: "packagist"
  framework:
    name: "Laravel"
    version: "^12.0"
    registry: "packagist"
  ui_layer:
    name: "Inertia + React"
    version: "^2.0"
    type: "spa-dashboard"
  database:
    engine: "MongoDB"
    version: ">=7.0"
    features:
      - "embedded-documents"
      - "aggregation-pipeline"
      - "wiredtiger"
  cache_queue:
    engine: "Redis"
    version: ">=7.0"
  auth_system:
    type: "laravel-breeze-inertia"
    features:
      - "Argon2id"
      - "Session Regeneration"

layers:
  starter:
    path: "starter/"
    type: "monolithic-app"
  rules:
    source_dir: "rules/source/"
    generated_targets:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".cursor/rules/*.mdc"
      - ".github/copilot-instructions.md"
      - ".agents/rules/*.md"
      - ".windsurfrules"
  skills:
    dir: "skills/"
    manifest:
      - id: "mongodb-aggregation"
        path: "skills/mongodb-aggregation/SKILL.md"
        description: "Construct safe, high-performance MongoDB aggregation pipelines."
  design:
    path: "DESIGN.md"
    theme_support:
      - "light"
      - "dark"
    wcag_compliance: "AA"
  security:
    config_dir: "security/"
    checks:
      - "semgrep"
      - "gitleaks"
      - "rules-backdoor-check"
  steps:
    path: "steps/agent-build-steps.md"
    total_steps: 8

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
    prompt_injection_boundary_nonces: true
  badges:
    - name: "Zero Plaintext Credentials"
      status: "verified"
    - name: "OWASP Top 10 Guardrails"
      status: "verified"

install:
  clone_command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git --depth 1"
  quickstart: "cd kits/laravel-mongodb && cp .env.example .env && composer install && npm install"

agent_bootstrap_prompt: |
  You are an expert engineer building with the TechTalks "laravel-mongodb" kit.
  Adhere strictly to:
  1. Extend MongoDB\Laravel\Eloquent\Model for document models.
  2. Use typed embedded documents (embedsOne / embedsMany).
  3. Never construct raw MongoDB operators with unsanitized user keys ($where forbidden).
  4. Build custom dashboard layouts using DESIGN.md tokens and React components.
