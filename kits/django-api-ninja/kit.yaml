schema_version: "1.0.0"

name: "Django + Django Ninja + PostgreSQL + Celery"
slug: "django-api-ninja"
version: "1.0.0"
status: "stable"
category: "Python Full-Stack & APIs"
updated_at: "2026-10-22"

description: "High-throughput API-only Django: full power of Django ORM, migrations, and authentication behind typed Pydantic endpoints, OpenAPI 3.1, and async Celery background workers."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Systems Architect"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "Python"
    version: ">= 3.12"
    registry: "pypi.org"
  framework:
    name: "Django Ninja"
    version: ">= 1.3.0"
    registry: "pypi.org"
  core:
    name: "Django"
    version: ">= 5.1.0"
    registry: "pypi.org"
  database:
    engine: "PostgreSQL"
    version: ">= 16.0"
    driver: "psycopg3"
  async_queue:
    engine: "Celery"
    version: ">= 5.4.0"
    broker: "Redis 7"
  runtime: "Docker (Rootless UID 10001)"
  features:
    - "Pydantic v2 validation core"
    - "Auto-generated OpenAPI 3.1 / Swagger docs"
    - "Select/prefetch related N+1 query protection"
    - "JSON task payload serialization"

layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: skills/
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install, orchestrate, and verify the Django 5 + Django Ninja + PostgreSQL + Celery API stack.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Build the canonical first API resource with CRUD endpoints, authentication, and Celery async notification.
      - id: ninja-router
        path: skills/ninja-router/SKILL.md
        description: Scaffold Django Ninja API routers, Pydantic request/response schemas, and OpenAPI docs.
      - id: django-orm-migration
        path: skills/django-orm-migration/SKILL.md
        description: Create PostgreSQL models, write reversible migrations, and optimize queries with select_related.
      - id: django-api-ninja-core
        path: skills/django-api-ninja-core/SKILL.md
        description: Core operations, Celery worker management, Redis caching, and token benchmark evaluation.
  evals:
    tasks_dir: evals/tasks/
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: DESIGN.md
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: security/
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 20500
  efficiency_tier: "A"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
