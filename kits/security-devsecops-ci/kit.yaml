schema_version: 1.0.0
name: DevSecOps CI Pipeline (Gitleaks + Semgrep + Trivy + GitHub Actions)
slug: security-devsecops-ci
version: 1.0.0
status: stable
category: security
updated_at: '2026-10-22'
description: Production-grade DevSecOps continuous integration harness enforcing Gitleaks
  secret scanning, Semgrep AST SAST analysis, Trivy container CVE scans, and Syft
  SBOM generation.
maintainer: TechTalks Engineering
stack:
  language:
    name: YAML / Python / Bash
    version: '>= 3.11'
    registry: pypi.org
  framework:
    name: GitHub Actions
    version: v4
    registry: github.com/actions
  database:
    engine: SARIF 2.1.0 / GitHub Security Graph
    version: 2.1.0
    features:
    - Code Scanning
    - Secret Alerts
    - Dependabot
  runtime:
    name: Docker & Python
    version: '>= 24.0'
  secrets_audit: Gitleaks 8+
  sast_scanner: Semgrep OSS (OWASP Top 10 + Custom AST rules)
  cve_scanner: Aqua Security Trivy 0.50+
  sbom_generator: Anchore Syft (SPDX 2.3 & CycloneDX 1.5)
starter:
  path: starter/
  health_endpoint: /healthz
  port: 8080
  env_file: .env.example
rules:
  source: rules/source/
  dialects:
  - CLAUDE.md
  - AGENTS.md
  - CODEX.md
  - .cursor/rules/
  - .agents/rules/
  - .clinerules
  - .windsurfrules
  - .github/copilot-instructions.md
  rules:
  - id: 01-pipeline-architecture-and-standards
    title: DevSecOps CI Pipeline Architecture and Gating Standards
  - id: 02-secret-detection-and-gitleaks
    title: Secret Detection, Entropy Scanning, and Gitleaks Invariants
  - id: 03-sast-and-semgrep-rules
    title: Static Application Security Testing (SAST) and Custom Semgrep Rules
  - id: 04-container-scanning-and-trivy
    title: Container Hardening, CVE Scanning, and Trivy Invariants
  - id: 05-supply-chain-sbom-cosign
    title: Supply Chain Security, SBOM Generation, and Cosign Verification
skills:
- name: install-and-verify
  path: skills/install-and-verify/SKILL.md
- name: first-feature
  path: skills/first-feature/SKILL.md
- name: semgrep-rule-authoring
  path: skills/semgrep-rule-authoring/SKILL.md
- name: trivy-container-scanning
  path: skills/trivy-container-scanning/SKILL.md
- name: gitleaks-secret-scanning
  path: skills/gitleaks-secret-scanning/SKILL.md
evals:
  framework: custom
  tasks:
  - id: eval-01-custom-semgrep-rule
    file: evals/tasks/task-01-custom-semgrep-rule.json
  - id: eval-02-trivy-sarif-integration
    file: evals/tasks/task-02-trivy-sarif-integration.json
  - id: eval-03-sbom-cyclonedx-generation
    file: evals/tasks/task-03-sbom-cyclonedx-generation.json
security:
  framework: gitleaks+semgrep+trivy
  checks_file: security/checks.json
  total_controls: 12
install:
  prerequisites:
  - Docker >= 24.0
  - Python >= 3.11
  - Git >= 2.40
  steps:
  - python3 starter/scripts/run_local_pipeline.py
  - python3 starter/tests/pipeline_test.py
  - docker compose -f starter/docker-compose.yml up -d
  - curl http://localhost:8080/healthz
