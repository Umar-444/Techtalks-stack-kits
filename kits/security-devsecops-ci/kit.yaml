schema_version: "1.0.0"

name: "DevSecOps CI Pipeline (Gitleaks + Semgrep + Trivy + GitHub Actions)"
slug: "security-devsecops-ci"
version: "1.0.0"
status: "stable"
category: "DevSecOps"
updated_at: "2026-10-22"

description: "Production-grade CI/CD pipeline automation integrating secret scanning (Gitleaks), SAST (Semgrep), container vulnerability scanning (Trivy), and SARIF reporting."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "YAML / Bash / Python"
    version: "3.12+"
    registry: "github.com"
  framework:
    name: "GitHub Actions"
    version: "v4"
    registry: "github.com"
  security_tools:
    gitleaks: "v8.18+"
    semgrep: "1.90+"
    trivy: "0.55+"
  runtime:
    name: "GitHub-Hosted Runner"
    version: "ubuntu-latest"

layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: skills/
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install and orchestrate Gitleaks, Semgrep, and Trivy tools locally.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Author composite security scan pipeline generating aggregated SARIF.
      - id: gitleaks-secret-scanning
        path: skills/gitleaks-secret-scanning/SKILL.md
        description: Configure Gitleaks baseline, custom secret rules, and pre-commit hooks.
      - id: semgrep-rule-authoring
        path: skills/semgrep-rule-authoring/SKILL.md
        description: Author custom Semgrep AST patterns with autofixes and policy enforcement.
      - id: trivy-container-scanning
        path: skills/trivy-container-scanning/SKILL.md
        description: Scan container images, lockfiles, and Kubernetes manifests for CVEs.
      - id: security-devsecops-ci-core
        path: skills/security-devsecops-ci-core/SKILL.md
        description: Core workflow configurations, SARIF upload, and security gate definitions.
  evals:
    tasks_dir: evals/tasks/
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: DESIGN.md
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: security/
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 8396
  efficiency_tier: "A+"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
