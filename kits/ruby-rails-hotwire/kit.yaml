schema_version: 1.0.0
name: Ruby on Rails 8 + Hotwire (Turbo + Stimulus) + SQLite/PostgreSQL
slug: ruby-rails-hotwire
version: 1.0.0
status: stable
category: fullstack
updated_at: '2026-10-22'
description: Production-grade Ruby on Rails 8 kit featuring the native Solid Suite
  (Solid Cache, Solid Queue, Solid Cable) and Hotwire Turbo 8 reactive HTML streaming.
maintainer: TechTalks Engineering
stack:
  language:
    name: Ruby
    version: '>= 3.3.0'
    registry: rubygems.org
  framework:
    name: Ruby on Rails
    version: ~> 8.0.0
    registry: rubygems.org
  ui_engine:
    name: Hotwire (Turbo 8 + Stimulus 3)
    version: ~> 2.0
  database:
    engine: PostgreSQL / SQLite
    version: '>= 16.0'
    features:
    - Solid Cache
    - Solid Queue
    - Solid Cable
  runtime:
    name: Ruby
    version: '>= 3.3.6'
starter:
  path: starter/
  health_endpoint: /healthz
  port: 3000
  env_file: .env.example
rules:
  source: rules/source/
  dialects:
  - CLAUDE.md
  - AGENTS.md
  - CODEX.md
  - .cursor/rules/
  - .agents/rules/
  - .clinerules
  - .windsurfrules
  - .github/copilot-instructions.md
  rules:
  - id: 01-rails-conventions-and-architecture
    title: Rails 8 Architecture and Solid Stack Standards
  - id: 02-hotwire-turbo-stimulus
    title: Hotwire Turbo 8 and Stimulus Reactive Architecture
  - id: 03-active-record-database
    title: ActiveRecord Integrity, Migrations, and Query Tuning
  - id: 04-brakeman-and-rails-security
    title: Rails Security Invariants, Strong Parameters, and Brakeman
  - id: 05-minitest-system-testing
    title: Testing Standards with Minitest, System Tests, and Hotwire Assertions
skills:
- name: install-and-verify
  path: skills/install-and-verify/SKILL.md
- name: first-feature
  path: skills/first-feature/SKILL.md
- name: turbo-streams-broadcast
  path: skills/turbo-streams-broadcast/SKILL.md
- name: active-record-postgres-tuning
  path: skills/active-record-postgres-tuning/SKILL.md
- name: brakeman-security-audit
  path: skills/brakeman-security-audit/SKILL.md
evals:
  framework: custom
  tasks:
  - id: eval-01-turbo-stream-scaffold
    file: evals/tasks/task-01-turbo-stream-scaffold.json
  - id: eval-02-strong-parameters-security
    file: evals/tasks/task-02-strong-parameters-security.json
  - id: eval-03-solid-cable-concurrency
    file: evals/tasks/task-03-solid-cable-concurrency.json
security:
  framework: brakeman
  checks_file: security/checks.json
  total_controls: 12
install:
  prerequisites:
  - Ruby >= 3.3.0
  - Bundler >= 2.5
  - SQLite3 or PostgreSQL >= 16
  steps:
  - bundle install
  - bin/rails db:prepare
  - bundle exec brakeman -q -z
  - bin/rails test
  - bin/rails server
