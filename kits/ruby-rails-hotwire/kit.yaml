schema_version: "1.0.0"

name: "Ruby on Rails 8 + Hotwire (Turbo + Stimulus) + SQLite/PostgreSQL"
slug: "ruby-rails-hotwire"
version: "1.0.0"
status: "stable"
category: "fullstack"
updated_at: "2026-10-22"

description: "Production-grade Ruby on Rails 8 kit featuring the native Solid Suite (Solid Cache, Solid Queue, Solid Cable) and Hotwire Turbo 8 reactive HTML streaming."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "Ruby"
    version: ">= 3.3.0"
    registry: "rubygems.org"
  framework:
    name: "Ruby on Rails"
    version: "~> 8.0.0"
    registry: "rubygems.org"
  ui_engine:
    name: "Hotwire (Turbo 8 + Stimulus 3)"
    version: "~> 2.0"
  database:
    engine: "PostgreSQL / SQLite"
    version: ">= 16.0"
    features:
      - "Solid Cache"
      - "Solid Queue"
      - "Solid Cable"
  runtime:
    name: "Ruby"
    version: ">= 3.3.6"

layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: skills/
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install and orchestrate Ruby on Rails 8 with Solid Suite and Hotwire.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Build canonical Article feature with Turbo Streams live broadcasting.
      - id: turbo-streams-broadcast
        path: skills/turbo-streams-broadcast/SKILL.md
        description: Real-time reactive HTML updates over WebSockets via Solid Cable.
      - id: active-record-postgres-tuning
        path: skills/active-record-postgres-tuning/SKILL.md
        description: Optimize ActiveRecord queries, composite indexes, and connection pooling.
      - id: brakeman-security-audit
        path: skills/brakeman-security-audit/SKILL.md
        description: Execute Brakeman static analysis for Rails vulnerability scanning.
      - id: ruby-rails-hotwire-core
        path: skills/ruby-rails-hotwire-core/SKILL.md
        description: Core operational commands, Solid Suite migrations, and Puma configuration.
  evals:
    tasks_dir: evals/tasks/
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: DESIGN.md
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: security/
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 14196
  efficiency_tier: "A+"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
