services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_tools_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      MCP_TRANSPORT: sse
      MCP_API_KEY: mcp-mock-secret-token-12345
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - mcp_net

networks:
  mcp_net:
    driver: bridge
