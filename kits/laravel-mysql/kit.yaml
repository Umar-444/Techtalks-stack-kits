schema_version: 1.0.0
name: Laravel 12 + MySQL Dashboard
slug: laravel-mysql
version: 1.0.0
status: blueprint
updated_at: '2026-10-21'
description: Classic Laravel 12 monolithic web application featuring MySQL 8+, Fortify
  authentication, Blade templates, and responsive dashboard components.
category: Laravel
maintainer:
  name: Umar Farooq
  role: Laravel Lead
  url: https://itsumarfarooq.com
  github: umar-444
stack:
  language:
    name: PHP
    version: ^8.4
    registry: packagist
  framework:
    name: Laravel
    version: ^12.0
    registry: packagist
  database:
    engine: MySQL
    version: 8.0+
    features:
    - InnoDB
    - ACID transactions
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: laravel-mysql-core
      path: skills/laravel-mysql-core/SKILL.md
      description: Core operations skill for Laravel 12 + MySQL Dashboard.
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: false
  median_eval_tokens: 27500
  efficiency_tier: B
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
