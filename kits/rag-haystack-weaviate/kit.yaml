schema_version: 1.0.0
name: Haystack Pipelines + Weaviate + FastAPI (Hayhooks)
slug: rag-haystack-weaviate
version: 1.0.0
status: blueprint
updated_at: '2026-10-21'
description: 'Explicit, inspectable DAG production pipelines: deepset Haystack 2.5+,
  Weaviate vector database with hybrid BM25 + dense vector ranking, and 9 built-in
  production evaluators.'
category: RAG
maintainer:
  name: TechTalks AI Engineering Group
  role: Search & Enterprise RAG Lead
  url: https://techtalks.itsumarfarooq.com/kits/propose/
  github: umar-444
stack:
  language:
    name: Python
    version: 3.12+
    registry: pypi.org
  framework:
    name: Haystack
    version: 2.5+
    registry: pypi.org
  vector_store: Weaviate (hybrid search)
  serving: Hayhooks / FastAPI
  evals: Haystack built-in DocumentRelevanceEvaluator
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: rag-haystack-weaviate-core
      path: skills/rag-haystack-weaviate-core/SKILL.md
      description: Core operations and scaffolding skill for Haystack Pipelines +
        Weaviate + FastAPI (Hayhooks).
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: false
  median_eval_tokens: 25600
  efficiency_tier: B
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
