schema_version: "1.0.0"

name: "Next.js 15+ + Prisma ORM + PostgreSQL + Tailwind CSS"
slug: "nextjs-prisma-postgresql"
version: "1.0.0"
status: "stable"
category: "JS / TS"
updated_at: "2026-10-22"

description: "Production full-stack React 19 / Next.js 15+ App Router blueprint kit featuring type-safe Prisma ORM migrations, PostgreSQL 16 connection pooling, Server Actions with Zod validation, and rootless multi-stage container deployment."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "TypeScript"
    version: "^5.6"
    registry: "npm"
  framework:
    name: "Next.js"
    version: "^15.0"
    registry: "npm"
  orm:
    name: "Prisma"
    version: "^6.0 || ^5.21"
    type: "type-safe-orm"
  database:
    engine: "PostgreSQL"
    version: ">= 16.0"
    features:
      - "Connection Pooling"
      - "Declarative Schema Migrations"
      - "Composite Unique Constraints"
      - "Full-Text Search Indices"
  styling:
    name: "Tailwind CSS"
    version: "^3.4 || ^4.0"
  runtime:
    name: "Node.js"
    version: ">= 22.0.0"
    registry: "npm"

layers:
  starter:
    path: starter/
    type: pre-wired-container
  rules:
    source_dir: rules/source/
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: skills/
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install, configure, and verify the Next.js 15 + Prisma + PostgreSQL stack with Docker and healthchecks.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Build the canonical Project & Task management module with Server Actions, Zod schema validation, and Prisma relations.
      - id: prisma-schema-migrations
        path: skills/prisma-schema-migrations/SKILL.md
        description: Author Prisma schemas, execute declarative migrations, and optimize connection pool parameters.
      - id: server-actions-zod
        path: skills/server-actions-zod/SKILL.md
        description: Scaffold secure Next.js 15 Server Actions with runtime Zod input validation and optimistic UI updates.
      - id: prisma-multi-tenant-isolation
        path: skills/prisma-multi-tenant-isolation/SKILL.md
        description: Implement multi-tenant data isolation and role-based access checks using Prisma Client extensions.
      - id: nextjs-prisma-postgresql-core
        path: skills/nextjs-prisma-postgresql-core/SKILL.md
        description: Core configuration, Prisma Studio workflows, and developer scripts.
  evals:
    tasks_dir: evals/tasks/
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: DESIGN.md
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: security/
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 16800
  efficiency_tier: "A"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
    rootless_container_enforced: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
