schema_version: "1.0.0"

name: "Laravel 13 + Filament 4 + PostgreSQL"
slug: "laravel-filament-postgresql"
version: "1.0.0"
status: "stable"
category: "Laravel"
updated_at: "2026-10-22"

description: "Production-ready administrative platform and SaaS backend kit. Bundles verified Laravel 13, Filament 4 panels, strict PostgreSQL 16+ schema conventions, granular BOLA authorization policies, and automated AI security guardrails."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "PHP"
    version: "^8.4"
    registry: "packagist"
  framework:
    name: "Laravel"
    version: "^12.0 || ^13.0"
    registry: "packagist"
  ui_layer:
    name: "Filament"
    version: "^4.0 || ^3.2"
    type: "admin-panel"
  database:
    engine: "PostgreSQL"
    version: ">=16.0"
    features:
      - "uuid-ossp"
      - "jsonb"
      - "pgcrypto"
  cache_queue:
    engine: "Redis"
    version: ">=7.0"
  auth_system:
    type: "session-passkeys"
    features:
      - "Argon2id"
      - "FIDO2 WebAuthn"
      - "Strict Session Fixation Defense"

layers:
  starter:
    path: starter/
    type: pre-wired-container
  rules:
    source_dir: rules/source/
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: skills/
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install, configure, and verify the Laravel 13 + Filament 4 + PostgreSQL multi-container stack.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Build the canonical first feature - Customer Resource with UUID keys, BOLA authorization policy, and Filament table/form schema.
      - id: filament-resource
        path: skills/filament-resource/SKILL.md
        description: Scaffold and configure Filament 4 admin panel resources, form schemas, and table actions.
      - id: laravel-policy
        path: skills/laravel-policy/SKILL.md
        description: Generate granular Laravel Model Policies enforcing zero-trust BOLA and multi-tenant authorization.
      - id: pest-arch-test
        path: skills/pest-arch-test/SKILL.md
        description: Execute Pest Architectural tests verifying strict layering, UUID usage, and zero debugging calls.
      - id: postgres-migration
        path: skills/postgres-migration/SKILL.md
        description: Create zero-downtime PostgreSQL migrations with native UUIDs, JSONB columns, and composite indexes.
  evals:
    tasks_dir: evals/tasks/
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: DESIGN.md
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: security/
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 16200
  efficiency_tier: "A"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
