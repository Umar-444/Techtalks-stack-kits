server:
  port: 5150
  binding: 0.0.0.0
  host: http://localhost
database:
  uri: sqlite://storage/db.sqlite?mode=rwc&_journal_mode=WAL&_busy_timeout=5000&_synchronous=NORMAL
  enable_logging: true
  min_connections: 1
  max_connections: 10
  auto_migrate: true
logger:
  level: info
  format: compact
cors:
  enable: true
  allow_origins:
    - http://localhost:3000
    - http://localhost:5150
