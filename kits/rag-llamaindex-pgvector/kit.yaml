schema_version: 1.0.0
name: LlamaIndex + PostgreSQL pgvector + FastAPI
slug: rag-llamaindex-pgvector
version: 1.0.0
status: blueprint
updated_at: '2026-10-21'
description: 'Data-first RAG on existing database infrastructure: LlamaIndex 0.11+
  ingestion pipelines, PostgreSQL pgvector cosine similarity index, FastAPI streaming
  endpoints, and built-in faithfulness/relevancy evals.'
category: RAG
maintainer:
  name: TechTalks AI Engineering Group
  role: RAG & Vector Search Lead
  url: https://techtalks.itsumarfarooq.com/kits/propose/
  github: umar-444
stack:
  language:
    name: Python
    version: 3.12+
    registry: pypi.org
  framework:
    name: LlamaIndex
    version: 0.11+
    registry: pypi.org
  api_server: FastAPI
  vector_store: PostgreSQL 16+ with pgvector extension
  evals: FaithfulnessEvaluator & RelevancyEvaluator
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: rag-llamaindex-pgvector-core
      path: skills/rag-llamaindex-pgvector-core/SKILL.md
      description: Core operations and scaffolding skill for LlamaIndex + PostgreSQL
        pgvector + FastAPI.
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: false
  median_eval_tokens: 23200
  efficiency_tier: A
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
