schema_version: "1.0.0"

name: "TypeScript + Hono + Bun + SQLite (Drizzle ORM)"
slug: "ts-hono-bun-sqlite"
version: "1.0.0"
status: "stable"
category: "backend"
updated_at: "2026-10-22"

description: "Ultra-fast, edge-ready TypeScript REST API powered by the Bun runtime, Hono framework, Drizzle ORM, and local embedded SQLite with WAL mode."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "TypeScript"
    version: ">= 5.5"
    registry: "npm"
  framework:
    name: "Hono"
    version: "^4.6"
    registry: "npm"
  database:
    engine: "SQLite (bun:sqlite)"
    version: ">= 3.45"
    features:
      - "WAL Journaling"
      - "Drizzle ORM Migrations"
      - "Zod Schema Validation"
  runtime:
    name: "Bun"
    version: ">= 1.1.29"

layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: skills/
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install and orchestrate Bun, Hono, and Drizzle ORM.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Build canonical Item CRUD endpoint with Drizzle ORM and Zod validation.
      - id: hono-zod-openapi
        path: skills/hono-zod-openapi/SKILL.md
        description: Author OpenAPI specifications and type-safe Zod route validation.
      - id: drizzle-sqlite-migrations
        path: skills/drizzle-sqlite-migrations/SKILL.md
        description: Author and run zero-downtime Drizzle SQLite migrations.
      - id: bun-performance-tuning
        path: skills/bun-performance-tuning/SKILL.md
        description: Configure Bun native SQLite WAL mode and connection pooling.
      - id: ts-hono-bun-sqlite-core
        path: skills/ts-hono-bun-sqlite-core/SKILL.md
        description: Core operational commands, package scripts, and Bun runtime settings.
  evals:
    tasks_dir: evals/tasks/
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: DESIGN.md
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: security/
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 15400
  efficiency_tier: "A"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
