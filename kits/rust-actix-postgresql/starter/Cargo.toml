[package]
name = "rust_actix_postgresql_starter"
version = "1.0.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
actix-cors = "0.7"
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.18", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
dotenvy = "0.15"
tokio = { version = "1.40", features = ["full"] }
thiserror = "1.0"

[dev-dependencies]
actix-rt = "2.10"
