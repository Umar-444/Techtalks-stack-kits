[package]
name = "rust-actix-postgresql-starter"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9"
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11"
dotenvy = "0.15"
