schema_version: 1.0.0
name: Rust + Actix Web + SeaORM + PostgreSQL
slug: rust-actix-postgresql
version: 1.0.0
status: blueprint
updated_at: '2026-10-21'
description: 'High-throughput API champion: Actix Web actor-based multi-threaded engine
  paired with SeaORM dynamic async ORM and PostgreSQL.'
category: Rust
maintainer:
  name: TechTalks Rust Community Maintainers
  role: High-Performance Systems Engineer
  url: https://techtalks.itsumarfarooq.com/kits/propose/
  github: umar-444
stack:
  language:
    name: Rust
    version: 1.80+
    registry: crates.io
  framework:
    name: Actix Web
    version: 4.9+
    registry: crates.io
  database:
    engine: PostgreSQL
    version: 16+
    features:
    - SeaORM migrations
    - ActiveModel traits
  orm: SeaORM 1.1+
  runtime: Actix runtime (Tokio-backed)
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: rust-actix-postgresql-core
      path: skills/rust-actix-postgresql-core/SKILL.md
      description: Core operations and scaffolding skill for Rust + Actix Web + SeaORM
        + PostgreSQL.
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: false
  median_eval_tokens: 26800
  efficiency_tier: B
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
