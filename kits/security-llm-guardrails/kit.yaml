schema_version: 1.0.0
name: LLM Guardrails & AI Gateway (Pydantic AI + Llama Guard)
slug: security-llm-guardrails
version: 1.0.0
status: blueprint
updated_at: '2026-10-21'
description: 'Stack-neutral AI security gateway: prompt injection screening, Presidio
  automated PII redaction pipeline, token and dollar budget limiters, and Pydantic
  AI strict output validation.'
category: Security
maintainer:
  name: TechTalks AI Security Group
  role: AI Safety & Guardrails Lead
  url: https://techtalks.itsumarfarooq.com/kits/propose/
  github: umar-444
stack:
  language:
    name: Python
    version: 3.12+
    registry: pypi.org
  framework:
    name: FastAPI
    version: 0.115+
    registry: pypi.org
  guardrails: Pydantic AI + Llama Guard 3
  pii_redaction: Microsoft Presidio
  budget_caps: Token & Dollar limit middleware
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: security-llm-guardrails-core
      path: skills/security-llm-guardrails-core/SKILL.md
      description: Core operations and scaffolding skill for LLM Guardrails & AI Gateway
        (Pydantic AI + Llama Guard).
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: true
  median_eval_tokens: 17600
  efficiency_tier: A+
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
