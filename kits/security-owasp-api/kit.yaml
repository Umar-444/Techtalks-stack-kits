schema_version: 1.0.0
name: OWASP API Security Top 10 Reference + Pytest Attack Suite
slug: security-owasp-api
version: 1.0.0
status: stable
updated_at: '2026-10-21'
description: 'Executable OWASP API Security Top 10 reference implementation built
  in FastAPI paired with a runnable pytest attack suite testing every control: BOLA,
  Broken Auth, BOPB, Rate Limiting, BFLA, and SSRF.'
category: Security
maintainer:
  name: Umar Farooq
  role: Senior Full-Stack & Security Engineer
  url: https://itsumarfarooq.com
  github: umar-444
stack:
  language:
    name: Python
    version: 3.12+
    registry: pypi.org
  framework:
    name: FastAPI
    version: 0.115+
    registry: pypi.org
  test_runner: Pytest + HTTPX TestClient
  security_standard: OWASP API Security Top 10 (2023)
  auth: PyJWT + Bcrypt
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: security-owasp-api-core
      path: skills/security-owasp-api-core/SKILL.md
      description: Core operations and scaffolding skill for OWASP API Security Top
        10 Reference + Pytest Attack Suite.
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: true
  median_eval_tokens: 15200
  efficiency_tier: A+
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
