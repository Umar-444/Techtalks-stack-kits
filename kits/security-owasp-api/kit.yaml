schema_version: "1.0.0"

name: "OWASP API Security Top 10 (2023) Test Harness (FastAPI + PyJWT + Pytest)"
slug: "security-owasp-api"
version: "1.0.0"
status: "stable"
category: "Security"
updated_at: "2026-10-22"

description: "Comprehensive automated API security testing suite and mock targets covering all OWASP API Security Top 10 (2023) vulnerability classes with remediation patterns."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "Python"
    version: ">= 3.12"
    registry: "pypi.org"
  framework:
    name: "FastAPI"
    version: "^0.115"
    registry: "pypi.org"
  security_specs:
    standard: "OWASP API Security Top 10"
    version: "2023"
  testing:
    framework: "Pytest"
    version: ">= 8.3"
  runtime:
    name: "Python"
    version: ">= 3.12"

layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: skills/
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install and orchestrate the OWASP API Security test harness.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Build canonical BOLA vulnerability test case and verified fix.
      - id: bola-authorization-testing
        path: skills/bola-authorization-testing/SKILL.md
        description: Test and remediate Broken Object Level Authorization (API1:2023).
      - id: ssrf-defense-patterns
        path: skills/ssrf-defense-patterns/SKILL.md
        description: Defend against Server-Side Request Forgery via IP allowlisting.
      - id: rate-limit-mitigation
        path: skills/rate-limit-mitigation/SKILL.md
        description: Implement token bucket rate limiting to prevent Unrestricted Resource Consumption.
      - id: security-owasp-api-core
        path: skills/security-owasp-api-core/SKILL.md
        description: Core test runner commands and OWASP Top 10 test suite execution.
  evals:
    tasks_dir: evals/tasks/
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: DESIGN.md
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: security/
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 15196
  efficiency_tier: "A+"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
