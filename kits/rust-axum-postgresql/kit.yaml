schema_version: 1.0.0
name: Rust + Axum + PostgreSQL (SQLx)
slug: rust-axum-postgresql
version: 1.0.0
status: stable
category: backend
updated_at: '2026-10-22'
description: Production-grade, zero-cost abstraction backend stack kit built with
  Rust 1.81+, Axum 0.8+, and PostgreSQL 16 with compile-time verified SQLx queries.
maintainer: TechTalks Engineering
stack:
  language:
    name: Rust
    version: '>= 1.80.0'
    registry: crates.io
  framework:
    name: Axum
    version: '>= 0.8.0'
    registry: crates.io
  database:
    engine: PostgreSQL
    version: '>= 16.0'
    features:
    - SQLx compile-checked queries
    - Connection pooling
    - Compound Indexing
  runtime:
    name: Tokio
    version: '>= 1.40.0'
  middleware: Tower-HTTP 0.6+ (CORS, Trace, Timeout, Compression)
starter:
  path: starter/
  health_endpoint: /healthz
  port: 3000
  env_file: .env.example
rules:
  source: rules/source/
  dialects:
  - CLAUDE.md
  - AGENTS.md
  - CODEX.md
  - .cursor/rules/
  - .agents/rules/
  - .clinerules
  - .windsurfrules
  - .github/copilot-instructions.md
  rules:
  - id: 01-axum-architecture-and-routing
    title: Axum Routing, Handlers, and State Extraction Architecture
  - id: 02-sqlx-compile-time-verification
    title: SQLx Compile-Time Verification, Migrations, and Connection Pooling
  - id: 03-tower-middleware-and-resilience
    title: Tower-HTTP Middleware Chaining, Observability, and Timeout Control
  - id: 04-rust-security-and-input-validation
    title: Memory Safety, Deserialization Limits, and Supply Chain Auditing
  - id: 05-tokio-concurrency-and-testing
    title: Async Tokio Runtime Concurrency and Integration Testing
skills:
- name: install-and-verify
  path: skills/install-and-verify/SKILL.md
- name: first-feature
  path: skills/first-feature/SKILL.md
- name: sqlx-compile-time-queries
  path: skills/sqlx-compile-time-queries/SKILL.md
- name: tower-middleware-layer
  path: skills/tower-middleware-layer/SKILL.md
- name: cargo-audit-security
  path: skills/cargo-audit-security/SKILL.md
evals:
  framework: cargo-test
  tasks:
  - id: eval-01-axum-handler-scaffold
    file: evals/tasks/task-01-axum-handler-scaffold.json
  - id: eval-02-sqlx-query-as-safety
    file: evals/tasks/task-02-sqlx-query-as-safety.json
  - id: eval-03-tower-layer-concurrency
    file: evals/tasks/task-03-tower-layer-concurrency.json
security:
  framework: cargo-audit+gitleaks
  checks_file: security/checks.json
  total_controls: 12
install:
  prerequisites:
  - Rust >= 1.80.0
  - Cargo >= 1.80.0
  - PostgreSQL >= 16.0
  - Docker >= 24.0
  steps:
  - cargo test
  - cargo sqlx migrate run
  - docker compose up -d
  - curl http://localhost:3000/healthz
