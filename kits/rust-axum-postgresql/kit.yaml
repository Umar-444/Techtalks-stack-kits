schema_version: 1.0.0
name: Rust + Axum + Tokio + SQLx + PostgreSQL
slug: rust-axum-postgresql
version: 1.0.0
status: blueprint
updated_at: '2026-10-21'
description: Modern async Rust web service built on Axum 0.8+, Tokio runtime, Tower
  middleware, and SQLx for compile-time verified SQL queries and injection resistance.
category: Rust
maintainer:
  name: TechTalks Rust Community Maintainers
  role: Rust Systems Engineers
  url: https://techtalks.itsumarfarooq.com/kits/propose/
  github: umar-444
stack:
  language:
    name: Rust
    version: 1.80+
    registry: crates.io
  framework:
    name: Axum
    version: 0.8+
    registry: crates.io
  database:
    engine: PostgreSQL
    version: 16+
    features:
    - sqlx compile-checked queries
    - connection pool
  runtime: Tokio 1.40+
  middleware: Tower-HTTP (CORS, Trace, Compression)
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: rust-axum-postgresql-core
      path: skills/rust-axum-postgresql-core/SKILL.md
      description: Core operations and scaffolding skill for Rust + Axum + Tokio +
        SQLx + PostgreSQL.
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: false
  median_eval_tokens: 24500
  efficiency_tier: B
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
