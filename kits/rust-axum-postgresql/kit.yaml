schema_version: "1.0.0"

name: "Rust + Axum + PostgreSQL (SQLx)"
slug: "rust-axum-postgresql"
version: "1.0.0"
status: "stable"
category: "backend"
updated_at: "2026-10-22"

description: "Production-grade asynchronous Rust web service using Axum 0.8, SQLx compile-time query verification, Tower middleware layers, and PostgreSQL 16+ connection pooling."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "Rust"
    version: ">= 1.81.0"
    registry: "crates.io"
  framework:
    name: "Axum"
    version: "^0.8"
    registry: "crates.io"
  database:
    engine: "PostgreSQL"
    version: ">= 16.0"
    features:
      - "SQLx Compile-Time Verification"
      - "Connection Pooling"
      - "Native UUIDs & JSONB"
  runtime:
    name: "Tokio"
    version: ">= 1.40"

layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: skills/
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install and orchestrate Axum, SQLx CLI, and PostgreSQL 16.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Build canonical Item CRUD endpoint with SQLx compile-time checked queries.
      - id: sqlx-compile-time-queries
        path: skills/sqlx-compile-time-queries/SKILL.md
        description: Configure SQLx offline mode, query validation, and zero-downtime migrations.
      - id: tower-middleware-layer
        path: skills/tower-middleware-layer/SKILL.md
        description: Author Tower middleware layers for request tracing, rate limiting, and CORS.
      - id: cargo-audit-security
        path: skills/cargo-audit-security/SKILL.md
        description: Execute cargo-audit and cargo-deny vulnerability scans.
      - id: rust-axum-postgresql-core
        path: skills/rust-axum-postgresql-core/SKILL.md
        description: Core operational workflows, Cargo build profiles, and Tokio runtime configuration.
  evals:
    tasks_dir: evals/tasks/
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: DESIGN.md
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: security/
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6

token_metrics:
  token_light: false
  median_eval_tokens: 24497
  efficiency_tier: "B"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
