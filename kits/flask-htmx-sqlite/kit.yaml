schema_version: 1.0.0
name: Flask + HTMX + SQLite
slug: flask-htmx-sqlite
version: 1.0.0
status: blueprint
updated_at: '2026-10-21'
description: 'Minimal Python full-stack stack: single-file Flask, HTMX 2.0 reactive
  DOM boosts, and zero-ceremony SQLite persistence. The Python entry in the Token-Light
  line.'
category: Token-Light
maintainer:
  name: TechTalks Python Engineering Group
  role: Python Web Lead
  url: https://techtalks.itsumarfarooq.com/kits/propose/
  github: umar-444
stack:
  language:
    name: Python
    version: 3.12+
    registry: pypi.org
  framework:
    name: Flask
    version: 3.0+
    registry: pypi.org
  interactivity: HTMX 2.0+
  database:
    engine: SQLite
    version: 3.45+
    features:
    - WAL mode
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: flask-htmx-sqlite-core
      path: skills/flask-htmx-sqlite-core/SKILL.md
      description: Core operations skill for Flask + HTMX + SQLite.
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: true
  median_eval_tokens: 15900
  efficiency_tier: A+
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
