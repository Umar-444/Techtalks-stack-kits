schema_version: 1.0.0
name: Agentic LangGraph + CrewAI + FastAPI
slug: agentic-langgraph-crewai
version: 1.0.0
status: stable
updated_at: '2026-10-22'
description: 'Production-ready multi-agent coordination architecture: LangGraph cyclic
  state machines paired with CrewAI autonomous agent squads and high-throughput async
  FastAPI endpoints.'
category: AI & Multi-Agent Systems
author: TechTalks AI Systems Engineering
maintainer:
  name: TechTalks Engineering
  role: Autonomous Systems Lead
  url: https://techtalks.itsumarfarooq.com/kits/
  github: Umar-444
stack:
  language: Python 3.12+
  framework: LangGraph 0.2+
  multi_agent: CrewAI 0.70+
  api: FastAPI 0.115+
  state_backend: Redis 7 / MemorySaver
  runtime: Docker (Rootless)
  extra:
  - Pydantic v2
  - Pytest-Asyncio
  - ChromaDB
layers:
  starter:
    path: starter/
    type: production-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - CODEX.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .clinerules
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: install-and-verify
      path: skills/install-and-verify/SKILL.md
      description: Install, orchestrate, and verify the Agentic LangGraph + CrewAI + FastAPI multi-agent stack.
    - id: first-feature
      path: skills/first-feature/SKILL.md
      description: Implement the canonical first feature - multi-agent automated code review graph.
    - id: langgraph-graph
      path: skills/langgraph-graph/SKILL.md
      description: Build cyclic and hierarchical LangGraph state machines with TypedDict and Redis persistence.
    - id: crewai-orchestration
      path: skills/crewai-orchestration/SKILL.md
      description: Define autonomous CrewAI agents with scoped roles, tools, and sandboxed delegation.
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: true
  median_eval_tokens: 16800
  efficiency_tier: A
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
    sandboxed_tools: true
agent_prompts:
  kickoff: You are building a production multi-agent system using the Agentic LangGraph
    + CrewAI + FastAPI kit. Adhere strictly to CLAUDE.md / .cursor/rules, immutable
    state schemas in app/state.py, and steps/agent-build-steps.md. Never execute unvalidated
    shell commands.
  verify: Run pytest tests/ and verify that all graph cycles terminate within the
    recursion limit and tool schemas validate cleanly.
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git && cd kits/agentic-langgraph-crewai
