[package]
name = "rust-leptos-starter"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["nightly"] }
leptos_axum = { version = "0.7", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1.40", optional = true, features = ["full"] }

[features]
hydrate = ["leptos/hydrate"]
ssr = ["leptos/ssr", "leptos_axum", "axum", "tokio"]
