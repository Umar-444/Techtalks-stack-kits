schema_version: 1.0.0
name: LangGraph + LangChain + Qdrant + Ragas Evals
slug: rag-langgraph-agentic
version: 1.0.0
status: blueprint
updated_at: '2026-10-21'
description: 'Agentic RAG with cyclical state graph execution: agent decides dynamically
  when to retrieve, when to re-write queries, and when to invoke human-in-the-loop
  review with Ragas groundedness evals.'
category: RAG
maintainer:
  name: TechTalks AI Engineering Group
  role: Agentic Systems Engineer
  url: https://techtalks.itsumarfarooq.com/kits/propose/
  github: umar-444
stack:
  language:
    name: Python
    version: 3.12+
    registry: pypi.org
  framework:
    name: LangGraph
    version: 0.2+
    registry: pypi.org
  orchestration: LangChain Core
  vector_store: Qdrant
  evals: Ragas groundedness & context precision
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: rag-langgraph-agentic-core
      path: skills/rag-langgraph-agentic-core/SKILL.md
      description: Core operations and scaffolding skill for LangGraph + LangChain
        + Qdrant + Ragas Evals.
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: false
  median_eval_tokens: 27800
  efficiency_tier: B
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
