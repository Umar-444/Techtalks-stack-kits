services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-langgraph-agentic-app
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - PORT=8080
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8080
      - QDRANT_URL=http://qdrant:6333
      - MAX_REWRITE_CYCLES=3
      - GROUNDEDNESS_THRESHOLD=0.85
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: rag-langgraph-agentic-qdrant
    # No published ports: Qdrant has no auth and is reachable only on the compose network.
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
