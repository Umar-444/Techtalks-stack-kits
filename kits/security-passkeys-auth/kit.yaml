schema_version: 1.0.0
name: Passkeys WebAuthn + Hardened Auth Reference (TypeScript)
slug: security-passkeys-auth
version: 1.0.0
status: blueprint
updated_at: '2026-10-21'
description: 'Verified passwordless FIDO2 / WebAuthn Passkeys authentication implementation
  in TypeScript: SimpleWebAuthn ceremonies, OAuth fallback, HttpOnly signed session
  cookies, and strict session fixation defenses.'
category: Security
maintainer:
  name: TechTalks Security Group
  role: Identity & Cryptography Engineer
  url: https://techtalks.itsumarfarooq.com/kits/propose/
  github: umar-444
stack:
  language:
    name: TypeScript
    version: 5.6+
    registry: npm
  framework:
    name: Hono
    version: 4.6+
    registry: npm
  runtime: Node.js 22+ / Bun 1.1+
  passkeys: '@simplewebauthn/server & @simplewebauthn/browser'
  session_store: Redis with cryptographic token rotation
  compliance: FIDO2 / WebAuthn Level 3
layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
    - AGENTS.md
    - CLAUDE.md
    - .cursor/rules/*.mdc
    - .github/copilot-instructions.md
    - .agents/rules/*.md
    - .windsurfrules
  skills:
    dir: skills/
    manifest:
    - id: security-passkeys-auth-core
      path: skills/security-passkeys-auth-core/SKILL.md
      description: Core operations and scaffolding skill for Passkeys WebAuthn + Hardened
        Auth Reference (TypeScript).
  design:
    path: DESIGN.md
    theme_support:
    - light
    - dark
    wcag_compliance: AA
  security:
    config_dir: security/
    checks:
    - gitleaks
    - semgrep
    - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6
token_metrics:
  token_light: true
  median_eval_tokens: 16900
  efficiency_tier: A+
security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true
install:
  command: git clone https://github.com/Umar-444/Techtalks-stack-kits.git
