schema_version: "1.0.0"

name: "Laravel 12 + Livewire 4 + PostgreSQL"
slug: "laravel-livewire-postgresql"
version: "1.0.0"
status: "stable"
category: "Laravel"
updated_at: "2026-10-22"

description: "Reactive full-stack TALL stack kit featuring Livewire 4, Volt single-file components, Folio page routing, Flux UI design tokens, Fortify authentication, and PostgreSQL 16+."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "PHP"
    version: "^8.4"
    registry: "packagist"
  framework:
    name: "Laravel"
    version: "^12.0"
    registry: "packagist"
  ui_layer:
    name: "Livewire 4 + Flux UI"
    version: "^4.0"
    type: "reactive-components"
  database:
    engine: "PostgreSQL"
    version: ">=16.0"
    features:
      - "uuid-ossp"
      - "jsonb"
  cache_queue:
    engine: "Redis"
    version: ">=7.0"
  auth_system:
    type: "laravel-fortify"
    features:
      - "2FA WebAuthn"
      - "Session Regeneration"

layers:
  starter:
    path: "starter/"
    type: "monolithic-app"
  rules:
    source_dir: "rules/source/"
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: "skills/"
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install, orchestrate, and verify the Laravel 12 + Livewire 4 + PostgreSQL reactive application.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Build the canonical first feature - Real-time Task Manager Livewire component with optimistic updates, UUID keys, and authorization policies.
      - id: livewire-volt-component
        path: skills/livewire-volt-component/SKILL.md
        description: Author high-velocity Volt single-file components with state, computed properties, and validation.
      - id: eloquent-postgres-indexes
        path: skills/eloquent-postgres-indexes/SKILL.md
        description: Optimize PostgreSQL 16+ schemas for Livewire apps using composite B-tree indexes, UUIDs, and JSONB queries.
      - id: flux-component
        path: skills/flux-component/SKILL.md
        description: Build accessible, responsive UI elements using Flux UI design tokens and Tailwind utility classes.
  evals:
    tasks_dir: "evals/tasks/"
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: "DESIGN.md"
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: "security/"
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: "steps/agent-build-steps.md"
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 15900
  efficiency_tier: "A"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
