[pytest]
testpaths = tests
python_files = test_*.py

# langsmith ships a pytest plugin that pytest auto-loads, which imports xxhash
# and its native extension. The guardrail suite never calls LangSmith, so that
# import is pure cost — and under a deep checkout path it fails outright on
# Windows with "DLL load failed ... filename or extension is too long".
# Disabling it keeps the run hermetic and independent of what else is installed.
addopts = -p no:langsmith_plugin -q
