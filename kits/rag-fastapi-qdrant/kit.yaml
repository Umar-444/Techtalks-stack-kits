schema_version: "1.0.0"

name: "RAG FastAPI + Qdrant + FastEmbed"
slug: "rag-fastapi-qdrant"
version: "1.0.0"
status: "stable"
category: "RAG"
updated_at: "2026-10-22"

description: "High-speed semantic search & retrieval augmented generation API using FastAPI, Qdrant vector database, local FastEmbed dense vector generation, and strict payload tenant isolation."

maintainer:
  name: "Umar Farooq"
  role: "Senior Full-Stack & Security Engineer"
  url: "https://itsumarfarooq.com"
  github: "umar-444"
  email: "contact@itsumarfarooq.com"

stack:
  language:
    name: "Python"
    version: ">= 3.12"
    registry: "pypi.org"
  framework:
    name: "FastAPI"
    version: ">= 0.115.0"
    registry: "pypi.org"
  database:
    engine: "Qdrant"
    version: ">= 1.12.0"
    features:
      - "HNSW Indexing"
      - "Cosine Distance"
      - "Single-Stage Payload Filtering"
      - "In-Memory Test Mode"
  embeddings:
    name: "FastEmbed"
    model: "BAAI/bge-small-en-v1.5"
    dimensions: 384
  runtime:
    name: "Uvicorn"
    version: ">= 0.32.0"

layers:
  starter:
    path: starter/
    type: starter-scaffold
  rules:
    source_dir: rules/source/
    generated_targets:
      - AGENTS.md
      - CLAUDE.md
      - CODEX.md
      - .cursor/rules/*.mdc
      - .github/copilot-instructions.md
      - .agents/rules/*.md
      - .clinerules
      - .windsurfrules
  skills:
    dir: skills/
    manifest:
      - id: install-and-verify
        path: skills/install-and-verify/SKILL.md
        description: Install, configure, orchestrate, and verify the FastAPI + Qdrant vector database RAG service.
      - id: first-feature
        path: skills/first-feature/SKILL.md
        description: Ingest a knowledge document, generate dense vector embeddings, index into Qdrant, and perform grounded semantic search.
      - id: qdrant-payload-filtering
        path: skills/qdrant-payload-filtering/SKILL.md
        description: Configure and execute Qdrant payload schema indexing and multi-condition boolean filters for tenant isolation.
      - id: chunking-and-embedding
        path: skills/chunking-and-embedding/SKILL.md
        description: Author optimized sliding-window document chunking and local dense embedding generation pipelines with FastEmbed.
      - id: rag-fastapi-qdrant-core
        path: skills/rag-fastapi-qdrant-core/SKILL.md
        description: Core operational workflows, collection snapshots, health checks, and query optimization for FastAPI + Qdrant.
  evals:
    tasks_dir: evals/tasks/
    total_evals: 3
    benchmark_pass_rate: 100%
  design:
    path: DESIGN.md
    theme_support:
      - light
      - dark
    wcag_compliance: "AA"
  security:
    config_dir: security/
    checks:
      - gitleaks
      - semgrep
      - owasp-top-10
  steps:
    path: steps/agent-build-steps.md
    total_steps: 6

token_metrics:
  token_light: true
  median_eval_tokens: 15400
  efficiency_tier: "A"

security:
  automated_scans:
    gitleaks: true
    semgrep_owasp_top10: true
    rules_backdoor_check: true
  rules_enforced:
    zero_plaintext_credentials: true
    strict_parameterized_queries: true
    authorization_on_every_resource: true

install:
  command: "git clone https://github.com/Umar-444/Techtalks-stack-kits.git"
