name: "Validate Stack Kits"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: "Validate all kit manifests"
        run: |
          for manifest in kits/*/kit.yaml; do
            if [ -f "$manifest" ]; then
              echo "Validating $manifest..."
              python tools/validate_manifest.py "$manifest"
            fi
          done

      - name: "Check rule transpiler drift"
        run: |
          for kit_dir in kits/*/; do
            if [ -d "${kit_dir}rules/source" ]; then
              echo "Checking transpiler drift for ${kit_dir}..."
              python tools/transpiler.py --kit "$kit_dir" --check
            fi
          done

      - name: "Scan for hardcoded credentials"
        run: |
          python -c "
          import os, sys
          forbidden = ['AKIA', 'ghp_', 'sk-', 'BEGIN RSA PRIVATE KEY']
          failed = False
          for root, dirs, files in os.walk('kits'):
              for f in files:
                  if f.endswith(('.php', '.md', '.yaml', '.yml', '.env.example', '.json')):
                      path = os.path.join(root, f)
                      with open(path, 'r', errors='ignore') as c:
                          text = c.read()
                          for term in forbidden:
                              if term in text:
                                  print(f'CRITICAL: Found forbidden secret pattern {term} in {path}')
                                  failed = True
          if failed:
              sys.exit(1)
          print('Secret scan passed: zero leaked credentials found.')
          "
