name: "Validate Stack Kits & Security Audit"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-manifests-and-drift:
    name: "Manifest & Transpiler Validation"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Validate all kit manifests & physical layers"
        run: |
          for manifest in kits/*/kit.yaml; do
            if [ -f "$manifest" ]; then
              echo "==> Validating $manifest..."
              python tools/validate_manifest.py "$manifest"
            fi
          done

      - name: "Check rule transpiler drift across all kits"
        run: |
          for kit_dir in kits/*/; do
            if [ -d "${kit_dir}rules/source" ]; then
              echo "==> Checking transpiler drift for ${kit_dir}..."
              python tools/transpiler.py --kit "$kit_dir" --check
            fi
          done

      - name: "Validate security manifests against JSON Schema"
        run: |
          python tools/validate_checks.py

      - name: "Audit every kit against the 18-checkpoint standard"
        run: |
          status=0
          for kit_dir in kits/*/; do
            slug="$(basename "$kit_dir")"
            [ -f "${kit_dir}kit.yaml" ] || continue
            python tools/audit_kit.py "$slug" || status=1
          done
          exit $status

      - name: "Check OWASP coverage matrix is current"
        run: |
          python tools/build_security_matrix.py --check

      - name: "Reject UTF-8 BOMs in parsed files"
        run: |
          python tools/check_encoding.py

      - name: "Check site header and footer are in sync"
        run: |
          python tools/build_chrome.py --check

      - name: "Check every image build context excludes secrets"
        run: |
          python tools/build_dockerignore.py --check

      - name: "Execute verification runner"
        run: |
          python evals/runner.py

      - name: "Check kit status board is current"
        run: |
          python tools/build_status_board.py
          git diff --exit-code status.json status/ \
            || (echo "::error::status board is stale — run tools/build_status_board.py and commit" && exit 1)

  gitleaks-secret-scan:
    name: "Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run Gitleaks Action"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-ast-scan:
    name: "Semgrep SAST Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run Semgrep OSS"
        run: |
          python -m pip install semgrep
          semgrep scan --config "p/owasp-top-ten" --config "p/php" --config "p/security-code-scan" --error
