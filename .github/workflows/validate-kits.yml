name: "Validate Stack Kits & Security Audit"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate-manifests-and-drift:
    name: "Manifest & Transpiler Validation"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: "Validate all kit manifests & physical layers"
        run: |
          for manifest in kits/*/kit.yaml; do
            if [ -f "$manifest" ]; then
              echo "==> Validating $manifest..."
              python tools/validate_manifest.py "$manifest"
            fi
          done

      - name: "Check rule transpiler drift across all kits"
        run: |
          for kit_dir in kits/*/; do
            if [ -d "${kit_dir}rules/source" ]; then
              echo "==> Checking transpiler drift for ${kit_dir}..."
              python tools/transpiler.py --kit "$kit_dir" --check
            fi
          done

      - name: "Execute benchmark evaluation runner"
        run: |
          python evals/runner.py

  gitleaks-secret-scan:
    name: "Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Run Gitleaks Action"
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep-ast-scan:
    name: "Semgrep SAST Scan"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Run Semgrep OSS"
        run: |
          python -m pip install semgrep
          semgrep scan --config "p/owasp-top-ten" --config "p/php" --config "p/security-code-scan" --error
